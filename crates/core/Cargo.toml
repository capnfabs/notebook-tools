[package]
name = "notebook_core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
# Transcriptions are cached on disk, by the photo's hash.
dirs = "7"
epaint_default_fonts.workspace = true
# Gzips project files.
flate2 = "1"
image.workspace = true
imageproc = { workspace = true, features = ["rayon"] }
krilla = "0.8"
log.workspace = true
# Markdown as plain text, for the PDF's text layer.
pulldown-cmark = { version = "0.13.5", default-features = false }
rayon.workspace = true
reqwest = { version = "0.13", features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
# Writes JSON files atomically.
tempfile.workspace = true
# Measures text, to stretch each line of the PDF's text layer across its box.
ttf-parser = "0.25"

# HEIC: ImageIO on macOS, libheif elsewhere. See `decisions/2026-11-01-heic-through-imageio.md`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
libheif-rs.workspace = true

[dev-dependencies]
insta = { version = "1", features = ["json"] }
lopdf = "0.46"
