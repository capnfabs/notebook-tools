[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
notebook_core = { path = "crates/core" }
eframe = "0.37.0"
egui_kittest = "0.37.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Image code is 5-30x slower unoptimized. Dependencies, plus core because the generic image code
# it calls is compiled there.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.notebook_core]
opt-level = 2
