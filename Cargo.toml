[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
notebook_core = { path = "crates/core" }
eframe = "0.37.0"
egui_kittest = "0.37.0"
# egui's bundled font, reused for the PDF's invisible text. Keep in step with eframe.
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27", default-features = false }
# Links the system libheif through pkg-config (`brew install libheif`): see
# `decisions/2026-10-31-image-decoding.md`.
libheif-rs = { version = "3", default-features = false, features = ["v1_19"] }
log = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# Image code is 5-30x slower unoptimized. See `decisions/2026-10-23-optimize-deps-in-dev.md`. Dependencies, plus core because the generic image code
# it calls is compiled there.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.notebook_core]
opt-level = 2
